name: Deploy Job Backoffice to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting Automated Deployment for Job-Backoffice..."

            # 1. Sync job-shared library first to prevent dependency desync
            echo "📦 Syncing shared library..."
            cd /opt/job-platform/job-shared
            git fetch origin main
            git reset --hard origin/main

            # 2. Check changes in job-backoffice
            echo "🔍 Checking changes in Job-Backoffice..."
            cd /opt/job-platform/job-backoffice
            git fetch origin main

            NEEDS_BUILD=$(git diff --name-only HEAD origin/main | grep -E "^(composer\.(json|lock)|package(-lock)?\.json|Dockerfile|Caddyfile|php\.ini|vite\.config\.js|tailwind\.config\.js|resources/(css|js))" || true)

            git reset --hard origin/main

            if [ -n "$NEEDS_BUILD" ]; then
              echo "🔨 Build required due to: $NEEDS_BUILD"
              echo "⚙️ Rebuilding Job-Backoffice Docker container safely..."
              cd /opt/job-platform
              docker compose up -d --build --no-deps job-admin
            else
              echo "⚡ Fast sync: Code-only changes detected. Syncing in-place..."
              [ -d /opt/job-platform/job-backoffice/app ] && docker cp /opt/job-platform/job-backoffice/app/. job_admin_web:/app/app/ || true
              [ -d /opt/job-platform/job-backoffice/resources ] && docker cp /opt/job-platform/job-backoffice/resources/. job_admin_web:/app/resources/ || true
              [ -d /opt/job-platform/job-backoffice/routes ] && docker cp /opt/job-platform/job-backoffice/routes/. job_admin_web:/app/routes/ || true
              [ -d /opt/job-platform/job-backoffice/config ] && docker cp /opt/job-platform/job-backoffice/config/. job_admin_web:/app/config/ || true
              [ -d /opt/job-platform/job-backoffice/database ] && docker cp /opt/job-platform/job-backoffice/database/. job_admin_web:/app/database/ || true

              # Sync latest shared library into container
              docker cp /opt/job-platform/job-shared/src/. job_admin_web:/app/vendor/job/shared/src/
              docker cp /opt/job-platform/job-shared/src/Support/. job_admin_web:/app/app/Support/ 2>/dev/null || true
              docker cp /opt/job-platform/job-shared/src/Enums/. job_admin_web:/app/app/Enums/ 2>/dev/null || true
            fi

            # 3. Database migrations (mandatory for backoffice)
            echo "🗄️ Running migrations..."
            docker exec job_admin_web php artisan migrate --force

            # 4. Optimize framework caches
            echo "🧹 Clearing and optimizing caches..."
            docker exec job_admin_web php artisan optimize:clear
            docker exec job_admin_web php artisan optimize

            # 5. Clean up old unused images to save VPS disk space
            echo "🗑️ Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Job-Backoffice Deployment Successful!"